<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentScout Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --sidebar-width: 280px;
            --sidebar-bg: #212529;
            --sidebar-color: #ffffff;
            --main-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --transition-speed: 0.3s;
        }

        body.dark-mode {
            --main-bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --sidebar-bg: #000000;
        }

        body.dark-mode #main-content {
            background-color: var(--main-bg);
        }

        body.dark-mode .list-group-item {
            color: var(--text-color);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .form-control,
        body.dark-mode .form-select {
            background-color: #2b2b2b;
            border-color: #404040;
            color: #ffffff;
        }

        body.dark-mode .form-control:focus,
        body.dark-mode .form-select:focus {
            background-color: #333333;
            color: #ffffff;
        }

        body.dark-mode .modal-content {
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        body.dark-mode .btn-close {
            filter: invert(1);
        }

        body {
            background-color: var(--main-bg) !important;
            color: var(--text-color) !important;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            min-height: 100vh;
            display: flex;
        }

        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            color: var(--sidebar-color);
            min-height: 100vh;
            position: fixed;
            transition: all var(--transition-speed);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        #main-content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 2rem;
            transition: margin-left var(--transition-speed);
        }

        .nav-pills .nav-link {
            color: rgba(255, 255, 255, 0.7);
            border-radius: 0;
            padding: 1rem 1.5rem;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }

        .nav-pills .nav-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .nav-pills .nav-link.active {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.15);
            border-left-color: #0d6efd;
        }

        .card {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            margin-bottom: 1.5rem;
        }

        .dark-mode-toggle {
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .dark-mode-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .badge-status {
            font-size: 0.8rem;
            padding: 0.4rem 0.6rem;
        }

        .candidate-photo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #dee2e6;
        }

        .list-group-item {
            transition: background-color 0.2s ease;
        }

        .btn {
            transition: all 0.2s ease !important;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .tab-pane {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cursor-pointer {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <aside id="sidebar">
        <div class="p-4 d-flex flex-column h-100">
            <div class="d-flex align-items-center mb-5">
                <i class="bi bi-rocket-takeoff-fill fs-3 me-2 text-primary"></i>
                <h4 class="mb-0 fw-bold">TalentScout</h4>
            </div>

            <ul class="nav nav-pills flex-column mb-auto" id="mainTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" type="button" role="tab">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="pipeline-tab" data-bs-toggle="tab" data-bs-target="#pipeline" type="button" role="tab">
                        <i class="bi bi-kanban me-2"></i> Pipeline
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="profiles-tab" data-bs-toggle="tab" data-bs-target="#profiles" type="button" role="tab">
                        <i class="bi bi-folder2-open me-2"></i> Perfiles
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="vacancies-tab" data-bs-toggle="tab" data-bs-target="#vacancies" type="button" role="tab">
                        <i class="bi bi-briefcase me-2"></i> Vacantes
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="candidates-tab" data-bs-toggle="tab" data-bs-target="#candidates" type="button" role="tab">
                        <i class="bi bi-people me-2"></i> Candidatos
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="evaluation-tab" data-bs-toggle="tab" data-bs-target="#evaluation" type="button" role="tab">
                        <i class="bi bi-clipboard-check me-2"></i> Evaluación
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="analytics-tab" data-bs-toggle="tab" data-bs-target="#analytics" type="button" role="tab">
                        <i class="bi bi-bar-chart me-2"></i> Analytics
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings" type="button" role="tab">
                        <i class="bi bi-gear me-2"></i> Configuración
                    </button>
                </li>
            </ul>

            <div class="mt-auto pt-3 border-top border-secondary">
                <div class="mb-3">
                    <label class="small text-secondary mb-1">Simular Rol:</label>
                    <select class="form-select form-select-sm bg-dark text-white border-secondary" data-action="switch-role">
                        <option value="Admin">Administrador</option>
                        <option value="Recruiter">Reclutador</option>
                        <option value="Interviewer">Entrevistador</option>
                    </select>
                </div>
                <div class="d-grid gap-2 mb-3">
                    <button class="btn btn-outline-info btn-sm" data-action="toggle-portal">
                        <i class="bi bi-box-arrow-up-right me-2"></i> Portal Candidato
                    </button>
                </div>
                <div class="d-flex align-items-center justify-content-between">
                    <span class="small text-secondary">v4.0 ATS Enterprise</span>
                </div>
            </div>
        </div>
    </aside>

    <main id="main-content">
        <div id="candidate-portal" class="d-none">
            <!-- Portal content -->
        </div>

        <div id="recruiter-app">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <h2 id="page-title" class="fw-bold">Dashboard</h2>
            <div id="header-actions" class="d-flex align-items-center">
                <i class="bi bi-moon-stars-fill fs-4 dark-mode-toggle me-3 text-secondary" id="darkModeToggle"></i>
                <!-- Contextual actions will appear here -->
            </div>
        </header>

        <div class="tab-content" id="mainTabsContent">
            <!-- Módulo 0: Dashboard -->
            <div class="tab-pane fade show active" id="dashboard" role="tabpanel">
                <!-- Dashboard content -->
            </div>

            <!-- Módulo 0.5: Pipeline Kanban -->
            <div class="tab-pane fade" id="pipeline" role="tabpanel">
                <!-- Kanban content -->
            </div>

            <!-- Módulo 1: Gestión de Perfiles -->
            <div class="tab-pane fade" id="profiles" role="tabpanel">
                <!-- Profile content -->
            </div>

            <!-- Módulo 1.5: Gestión de Vacantes -->
            <div class="tab-pane fade" id="vacancies" role="tabpanel">
                <!-- Vacancies content -->
            </div>

            <!-- Módulo 2: Base de Candidatos -->
            <div class="tab-pane fade" id="candidates" role="tabpanel">
                <!-- Candidates content -->
            </div>

            <!-- Módulo 3: Sala de Evaluación -->
            <div class="tab-pane fade" id="evaluation" role="tabpanel">
                <!-- Evaluation content -->
            </div>

            <!-- Módulo 4: Analytics & Comparación -->
            <div class="tab-pane fade" id="analytics" role="tabpanel">
                <!-- Analytics content -->
            </div>

            <!-- Módulo 5: Configuración Global -->
            <div class="tab-pane fade" id="settings" role="tabpanel">
                <!-- Settings content -->
            </div>
        </div>
        </div> <!-- End recruiter-app -->
    </main>

    <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="formModalLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="formModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="formModalSave">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <i class="bi bi-info-circle-fill me-2 text-primary"></i>
                <strong class="me-auto">TalentScout</strong>
                <small>Ahora</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage">
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalLabel">Confirmación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmModalDelete">Eliminar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        /**
         * MODEL: Data management and business logic
         */
        class TalentScoutModel {
            constructor() {
                this.data = {
                    profiles: {},
                    candidates: {},
                    vacancies: {},
                    settings: {
                        darkMode: false,
                        role: 'Admin',
                        thresholds: {
                            recommended: 80,
                            reserved: 60
                        }
                    },
                    evaluations: {}
                };
                this.loadData();
            }

            loadData() {
                const data = localStorage.getItem('talentScoutData');
                if (data) {
                    const parsed = JSON.parse(data);
                    // Migration for dark mode setting
                    if (parsed.settings && parsed.settings.darkMode === undefined) {
                        parsed.settings.darkMode = false;
                    }
                    if (!parsed.vacancies) {
                        parsed.vacancies = {};
                    }
                    this.data = parsed;
                } else {
                    this.initDefaultData();
                }
            }

            saveData() {
                localStorage.setItem('talentScoutData', JSON.stringify(this.data));
            }

            initDefaultData() {
                this.data.profiles = {
                    '1': { id: '1', name: 'Desarrollador Full Stack', skills: [
                        { name: 'React', category: 'Hard Skill', weight: 5 },
                        { name: 'Node.js', category: 'Hard Skill', weight: 5 },
                        { name: 'Inglés', category: 'Soft Skill', weight: 3 },
                        { name: 'Comunicación', category: 'Soft Skill', weight: 4 }
                    ]},
                    '2': { id: '2', name: 'Product Manager', skills: [
                        { name: 'Agile', category: 'Hard Skill', weight: 5 },
                        { name: 'Roadmapping', category: 'Hard Skill', weight: 4 },
                        { name: 'Liderazgo', category: 'Soft Skill', weight: 5 },
                        { name: 'Empatía', category: 'Soft Skill', weight: 4 }
                    ]}
                };
                this.data.candidates = {
                    '1': { id: '1', name: 'Juan Perez', seniority: 'Senior', email: 'juan.perez@example.com', portfolio: 'https://example.com', status: 'Entrevistando', photoUrl: 'https://i.pravatar.cc/150?u=1' },
                    '2': { id: '2', name: 'Maria Garcia', seniority: 'Semi-Senior', email: 'maria.garcia@example.com', portfolio: 'https://example.com', status: 'Contratado', photoUrl: 'https://i.pravatar.cc/150?u=2' },
                    '3': { id: '3', name: 'Carlos Ruiz', seniority: 'Junior', email: 'carlos.ruiz@example.com', portfolio: 'https://example.com', status: 'Prospecto', photoUrl: 'https://i.pravatar.cc/150?u=3' }
                };
                this.data.vacancies = {
                    '1': { id: '1', title: 'Desarrollador Senior React', profileId: '1', status: 'Abierta', date: '2024-05-20' }
                };
                this.data.evaluations = {
                    '1': {
                        id: '1',
                        candidateId: '1',
                        profileId: '1',
                        vacancyId: '1',
                        status: 'Evaluado',
                        skills: [
                            { name: 'React', category: 'Hard Skill', weight: 5 },
                            { name: 'Node.js', category: 'Hard Skill', weight: 5 },
                            { name: 'Inglés', category: 'Soft Skill', weight: 3 },
                            { name: 'Comunicación', category: 'Soft Skill', weight: 4 }
                        ],
                        scores: [
                            { name: 'React', score: 9, notes: 'Excelente dominio' },
                            { name: 'Node.js', score: 8, notes: 'Muy bueno' },
                            { name: 'Inglés', score: 7, notes: 'Bueno' },
                            { name: 'Comunicación', score: 8, notes: 'Claro y conciso' }
                        ],
                        globalScore: 8.12,
                        finalRecommendation: 'Excelente candidato técnico con buenas habilidades de comunicación.'
                    }
                };
                this.saveData();
            }

            // Logic methods moved from TalentScoutApp
            updateThresholds(recommended, reserved) {
                this.data.settings.thresholds.recommended = recommended;
                this.data.settings.thresholds.reserved = reserved;
                this.saveData();
            }

            toggleDarkMode() {
                this.data.settings.darkMode = !this.data.settings.darkMode;
                this.saveData();
                return this.data.settings.darkMode;
            }

            setRole(role) {
                this.data.settings.role = role;
                this.saveData();
            }

            addProfile(name) {
                const id = Date.now().toString();
                this.data.profiles[id] = { id, name, skills: [] };
                this.saveData();
                return id;
            }

            bulkAddCandidates(candidates) {
                candidates.forEach(c => {
                    const id = (Date.now() + Math.random()).toString();
                    this.data.candidates[id] = { ...c, id, status: c.status || 'Prospecto' };
                });
                this.saveData();
            }

            updateProfileName(id, name) {
                if (this.data.profiles[id]) {
                    this.data.profiles[id].name = name;
                    this.saveData();
                }
            }

            updateCandidateStatus(id, status) {
                if (this.data.candidates[id]) {
                    this.data.candidates[id].status = status;
                    this.saveData();
                }
            }

            deleteProfile(id) {
                delete this.data.profiles[id];
                this.saveData();
            }

            addSkill(profileId, skill) {
                if (this.data.profiles[profileId]) {
                    this.data.profiles[profileId].skills.push(skill);
                    this.saveData();
                }
            }

            deleteSkill(profileId, index) {
                if (this.data.profiles[profileId]) {
                    this.data.profiles[profileId].skills.splice(index, 1);
                    this.saveData();
                }
            }

            addCandidate(candidate) {
                const id = Date.now().toString();
                this.data.candidates[id] = { ...candidate, id };
                this.saveData();
                return id;
            }

            deleteCandidate(id) {
                delete this.data.candidates[id];
                Object.keys(this.data.evaluations).forEach(evalId => {
                    if (this.data.evaluations[evalId].candidateId === id) {
                        delete this.data.evaluations[evalId];
                    }
                });
                this.saveData();
            }

            getEvaluation(profileId, candidateId, vacancyId) {
                return Object.values(this.data.evaluations).find(e =>
                    e.candidateId === candidateId &&
                    e.profileId === profileId &&
                    e.vacancyId === vacancyId
                );
            }

            createEvaluation(evaluation) {
                const id = Date.now().toString();
                this.data.evaluations[id] = { ...evaluation, id, feedback: [] };
                this.saveData();
                return this.data.evaluations[id];
            }

            addEvaluationFeedback(evalId, reviewer, comment, rating) {
                if (this.data.evaluations[evalId]) {
                    this.data.evaluations[evalId].feedback.push({
                        reviewer, comment, rating, date: new Date().toISOString()
                    });
                    this.saveData();
                }
            }

            updateEvaluationScore(evalId, skillIndex, score) {
                const evaluation = this.data.evaluations[evalId];
                if (evaluation) {
                    evaluation.scores[skillIndex].score = parseInt(score);
                    this.calculateGlobalScore(evaluation);
                    this.saveData();
                }
            }

            updateEvaluationNotes(evalId, skillIndex, notes) {
                if (this.data.evaluations[evalId]) {
                    this.data.evaluations[evalId].scores[skillIndex].notes = notes;
                    this.saveData();
                }
            }

            updateEvaluationFinalRec(evalId, rec) {
                if (this.data.evaluations[evalId]) {
                    this.data.evaluations[evalId].finalRecommendation = rec;
                    this.saveData();
                }
            }

            calculateGlobalScore(evaluation) {
                let totalScore = 0;
                let totalWeight = 0;
                evaluation.skills.forEach((skill, index) => {
                    totalScore += evaluation.scores[index].score * skill.weight;
                    totalWeight += skill.weight;
                });
                evaluation.globalScore = totalWeight > 0 ? totalScore / totalWeight : 0;
            }

            finishEvaluation(evalId) {
                if (this.data.evaluations[evalId]) {
                    this.data.evaluations[evalId].status = 'Evaluado';
                    this.saveData();
                }
            }

            addVacancy(vacancy) {
                const id = Date.now().toString();
                this.data.vacancies[id] = { ...vacancy, id, date: new Date().toISOString().split('T')[0] };
                this.saveData();
                return id;
            }

            deleteVacancy(id) {
                delete this.data.vacancies[id];
                this.saveData();
            }

            updateVacancyStatus(id, status) {
                if (this.data.vacancies[id]) {
                    this.data.vacancies[id].status = status;
                    this.saveData();
                }
            }

            resetData() {
                localStorage.removeItem('talentScoutData');
                location.reload();
            }
        }

        /**
         * VIEW: UI Rendering and DOM manipulation
         */
        class TalentScoutView {
            constructor() {
                this.mainContent = document.getElementById('mainTabsContent');
                this.pageTitle = document.getElementById('page-title');
                this.statusChart = null;
                this.funnelChart = null;
                this.radarChart = null;
            }

            applyRBAC(role) {
                const elements = {
                    'settings-tab': ['Admin'],
                    'profiles-tab': ['Admin', 'Recruiter'],
                    'vacancies-tab': ['Admin', 'Recruiter'],
                    'pipeline-tab': ['Admin', 'Recruiter', 'Interviewer'],
                    'candidates-tab': ['Admin', 'Recruiter'],
                    'evaluation-tab': ['Admin', 'Recruiter', 'Interviewer'],
                    'analytics-tab': ['Admin', 'Recruiter']
                };

                Object.keys(elements).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        const parent = el.closest('.nav-item');
                        if (elements[id].includes(role)) {
                            parent.classList.remove('d-none');
                        } else {
                            parent.classList.add('d-none');
                        }
                    }
                });
            }

            renderDashboard(data) {
                const container = document.getElementById('dashboard');
                const stats = {
                    totalCandidates: Object.keys(data.candidates).length,
                    activeProfiles: Object.keys(data.profiles).length,
                    evaluations: Object.values(data.evaluations).filter(e => e.status === 'Evaluado').length,
                    avgScore: 0
                };

                const evals = Object.values(data.evaluations).filter(e => e.status === 'Evaluado');
                if (evals.length > 0) {
                    stats.avgScore = evals.reduce((acc, curr) => acc + curr.globalScore, 0) / evals.length;
                }

                container.innerHTML = `
                    <div class="row g-4 mb-4">
                        <div class="col-md-3">
                            <div class="card p-3 border-start border-4 border-primary">
                                <h6 class="text-secondary mb-1">Candidatos Totales</h6>
                                <h2 class="fw-bold mb-0">${stats.totalCandidates}</h2>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 border-start border-4 border-info">
                                <h6 class="text-secondary mb-1">Perfiles Activos</h6>
                                <h2 class="fw-bold mb-0">${stats.activeProfiles}</h2>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 border-start border-4 border-success">
                                <h6 class="text-secondary mb-1">Entrevistas</h6>
                                <h2 class="fw-bold mb-0">${stats.evaluations}</h2>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 border-start border-4 border-warning">
                                <h6 class="text-secondary mb-1">Match Promedio</h6>
                                <h2 class="fw-bold mb-0">${(stats.avgScore * 10).toFixed(0)}%</h2>
                            </div>
                        </div>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-8">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title mb-4">Embudo de Reclutamiento (Conversion)</h5>
                                    <div style="height: 300px;"><canvas id="funnelChart"></canvas></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card h-100">
                                <div class="card-body text-center d-flex flex-column justify-content-center">
                                    <h5 class="card-title mb-4">Tiempo Medio Contratación</h5>
                                    <h1 class="display-1 fw-bold text-primary mb-0">18</h1>
                                    <p class="text-secondary mt-0">días</p>

                container.innerHTML = `
                    <div class="kanban-board">

            renderStatusChart(candidates) {
                const ctx = document.getElementById('statusChart').getContext('2d');
                const statuses = {};
                Object.values(candidates).forEach(c => {
                    const s = c.status || 'Prospecto';
                    statuses[s] = (statuses[s] || 0) + 1;
                });

                if (this.statusChart) this.statusChart.destroy();

                this.statusChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(statuses),
                        datasets: [{
                            data: Object.values(statuses),
                            backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#6c757d']
                        }]
                    },
                    options: {
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'right' } }
                    }
                });
            }

            renderFunnelChart(candidates) {
                const ctx = document.getElementById('funnelChart').getContext('2d');
                const stages = ['Prospecto', 'Prefiltrado', 'Entrevistando', 'Evaluación Técnica', 'Oferta', 'Contratado'];
                const counts = stages.map(stage => Object.values(candidates).filter(c => (c.status || 'Prospecto') === stage).length);

                // Cumulative counts to simulate a funnel (this is a simple simulation)
                let cumulative = 0;
                const funnelData = [];
                for (let i = counts.length - 1; i >= 0; i--) {
                    cumulative += counts[i];
                    funnelData.unshift(cumulative);
                }

                if (this.funnelChart) this.funnelChart.destroy();

                this.funnelChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: stages,
                        datasets: [{
                            label: 'Candidatos',
                            data: funnelData,
                            backgroundColor: 'rgba(13, 110, 253, 0.6)',
                            borderColor: '#0d6efd',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { x: { beginAtZero: true } }
                    }
                });
            }

        /**
         * CONTROLLER: Handles user input, updates Model, and refreshes View
         */
        class TalentScoutController {
            constructor(model, view) {
                this.model = model;
                this.view = view;
                this.bindEvents();
            }

            bindEvents() {
                // Global Actions (Delegated)
                document.addEventListener('click', (e) => {
                    const action = e.target.dataset.action || e.target.closest('[data-action]')?.dataset.action;
                    if (!action) return;
                    const id = e.target.dataset.id || e.target.closest('[data-id]')?.dataset.id;

                    if (action === 'toggle-portal') this.togglePortal();
                    if (action === 'toggle-dark-mode') {
                        const isDark = this.model.toggleDarkMode();
                        this.applyDarkMode(isDark);
                    }
                    if (action === 'edit-profile') this.editProfile(id);
                    if (action === 'delete-profile') this.deleteProfile(id);
                    if (action === 'create-profile') this.createProfile();
                    if (action === 'add-skill') this.addSkill(id);
                    if (action === 'delete-skill') this.deleteSkill(id, e.target.dataset.index);
                    if (action === 'delete-candidate') this.deleteCandidate(id);
                    if (action === 'import-candidates-trigger') document.getElementById('import-candidates-file').click();
                    if (action === 'download-candidate-template') this.downloadCandidateTemplate();
                    if (action === 'delete-vacancy') this.deleteVacancy(id);
                    if (action === 'view-vacancy') this.viewVacancy(id);
                    if (action === 'ai-analysis') this.aiAnalysis(id);
                    if (action === 'add-feedback') this.addFeedback(id);
                    if (action === 'schedule-interview') this.scheduleInterview(id);
                    if (action === 'apply-form') this.view.renderApplyForm(this.model.data.vacancies[id]);
                    if (action === 'toggle-vacancy-status') this.toggleVacancyStatus(id);
                    if (action === 'start-evaluation') this.startEvaluation();
                    if (action === 'finish-evaluation') this.finishEvaluation(id);
                    if (action === 'reset-data') this.model.resetData();
                    if (action === 'export-data') this.exportData();
                    if (action === 'import-data-trigger') document.getElementById('import-data-file').click();
                    if (action === 'load-demo') this.loadDemoData();
                });

                // Dark mode (Legacy icon click)
                document.getElementById('darkModeToggle').addEventListener('click', () => {
                    const isDark = this.model.toggleDarkMode();
                    this.applyDarkMode(isDark);
                });

                // Sidebar Tabs
                document.getElementById('mainTabs').addEventListener('shown.bs.tab', (e) => {
                    this.view.pageTitle.textContent = e.target.textContent.trim();
                    const tabId = e.target.id;
                    if (tabId === 'dashboard-tab') this.view.renderDashboard(this.model.data);
                    if (tabId === 'pipeline-tab') this.view.renderPipeline(this.model.data.candidates);
                    if (tabId === 'profiles-tab') this.view.renderProfiles(this.model.data.profiles);
                    if (tabId === 'vacancies-tab') this.view.renderVacancies(this.model.data.vacancies, this.model.data.profiles);
                    if (tabId === 'candidates-tab') this.view.renderCandidates(this.model.data.candidates);
                    if (tabId === 'evaluation-tab') this.view.renderEvaluation(this.model.data);
                    if (tabId === 'analytics-tab') {
                        this.view.renderAnalytics(this.model.data.profiles);
                        this.renderAnalyticsTable();
                    }
                    if (tabId === 'settings-tab') this.view.renderSettings(this.model.data.settings);
                });

                // Input Actions
                document.addEventListener('input', (e) => {
                    const action = e.target.dataset.action;
                    if (action === 'update-score') this.updateScore(e.target.dataset.id, e.target.dataset.index, e.target.value);
                });

                // Change Actions
                document.addEventListener('change', (e) => {
                    const action = e.target.dataset.action || e.target.closest('[data-action]')?.dataset.action;
                    const id = e.target.dataset.id || e.target.closest('[data-id]')?.dataset.id;

                    if (e.target.id === 'import-data-file') this.importData(e.target.files[0]);
                    if (e.target.id === 'import-candidates-file') this.importCandidates(e.target.files[0]);
                    if (action === 'switch-role') this.switchRole(e.target.value);
                    if (action === 'update-profile-name') this.model.updateProfileName(id, e.target.value);
                    if (action === 'update-notes') this.model.updateEvaluationNotes(id, e.target.dataset.index, e.target.value);
                    if (action === 'update-final-rec') this.model.updateEvaluationFinalRec(id, e.target.value);
                    if (action === 'update-thresholds') this.updateThresholds();
                    if (e.target.id === 'candidate-search') this.searchCandidates(e.target.value);
                    if (e.target.dataset.action === 'select-eval-vacancy') this.handleEvalVacancySelect(e.target.value);
                    if (e.target.id === 'analytics-profile-filter') this.renderAnalyticsTable();
                    if (e.target.name === 'compare-candidate') this.updateRadarChart();
                });

                // Submit Actions
                document.getElementById('mainTabsContent').addEventListener('submit', (e) => {
                    if (e.target.id === 'candidate-form') {
                        e.preventDefault();
                        this.addCandidate();
                    }
                    if (e.target.id === 'vacancy-form') {
                        e.preventDefault();
                        this.addVacancy();
                    }
                });
            }

            applyDarkMode(isDark) {
                if (isDark) {
                    document.body.classList.add('dark-mode');
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                    document.getElementById('darkModeToggle').classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
                } else {
                    document.body.classList.remove('dark-mode');
                    document.documentElement.setAttribute('data-bs-theme', 'light');
                    document.getElementById('darkModeToggle').classList.replace('bi-sun-fill', 'bi-moon-stars-fill');
                }
            }

            // --- Handler methods ---
            editProfile(id) {
                this.view.renderProfileDetails(this.model.data.profiles[id]);

            createProfile() {
                const modal = new bootstrap.Modal(document.getElementById('formModal'));
                document.getElementById('formModalLabel').innerText = 'Nuevo Perfil';
                document.getElementById('formModalBody').innerHTML = `<div class="mb-3"><label class="form-label">Nombre del Perfil</label><input type="text" id="new-profile-name" class="form-control"></div>`;

                        this.view.renderProfiles(this.model.data.profiles);
                        this.editProfile(id);
                        modal.hide();
                    }
                };
                modal.show();
            }

            toggleVacancyStatus(id) {
                const vacancy = this.model.data.vacancies[id];
                const newStatus = vacancy.status === 'Abierta' ? 'Cerrada' : 'Abierta';
                this.model.updateVacancyStatus(id, newStatus);
                this.view.renderVacancies(this.model.data.vacancies, this.model.data.profiles);
            }

            togglePortal() {
                const recruiterApp = document.getElementById('recruiter-app');
                const candidatePortal = document.getElementById('candidate-portal');
                const sidebar = document.getElementById('sidebar');

                if (candidatePortal.classList.contains('d-none')) {
                    candidatePortal.classList.remove('d-none');

                const name = document.getElementById('apply-name').value;

                const portfolio = document.getElementById('apply-portfolio').value;
                const vacancyId = document.getElementById('apply-vacancy-id').value;

                const candidate = {
                    name: document.getElementById('candidate-name').value,
                    seniority: document.getElementById('candidate-seniority').value,
                    status: document.getElementById('candidate-status').value,
                    email: document.getElementById('candidate-email').value,
                    portfolio: document.getElementById('candidate-portfolio').value,
                    photoUrl: document.getElementById('candidate-photo').value
                };

                    this.model.addCandidate(candidate);
                    this.view.renderCandidates(this.model.data.candidates);
                }
            }

            importCandidates(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const content = e.target.result;
                    let candidates = [];
                    if (file.name.endsWith('.json')) {
                        try { candidates = JSON.parse(content); } catch (err) { return this.view.showToast("JSON inválido", "danger"); }
                    } else if (file.name.endsWith('.csv')) {
                        const lines = content.split('\n');
                        const headers = lines[0].split(',').map(h => h.trim());
                        candidates = lines.slice(1).filter(l => l.trim()).map(line => {
                            const values = line.split(',').map(v => v.trim());
                            const obj = {};
                            headers.forEach((h, i) => obj[h] = values[i]);
                            return obj;
                        });
                    }
                    if (candidates.length > 0) {
                        this.model.bulkAddCandidates(candidates);
                        this.view.renderCandidates(this.model.data.candidates);
                        this.view.showToast(`Se importaron ${candidates.length} candidatos`, "success");
                    }
                };
                reader.readAsText(file);
            }

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "plantilla_candidatos.csv");

            searchCandidates(term) {
                const filtered = Object.values(this.model.data.candidates).filter(c => c.name.toLowerCase().includes(term.toLowerCase()));
                document.getElementById('candidate-list').innerHTML = this.view.renderCandidateList(filtered);
            }

            handleEvalVacancySelect(vacancyId) {
                if (!vacancyId) return;
                const vacancy = this.model.data.vacancies[vacancyId];
                if (vacancy && vacancy.profileId) {
                    document.getElementById('eval-profile-select').value = vacancy.profileId;
                }
            }

            startEvaluation() {
                const vacancyId = document.getElementById('eval-vacancy-select').value || null;
                const profileId = document.getElementById('eval-profile-select').value;
                const candidateId = document.getElementById('eval-candidate-select').value;

                if (!profileId || !candidateId) return this.view.showToast("Seleccione perfil y candidato", "danger");

                let evaluation = this.model.getEvaluation(profileId, candidateId, vacancyId);
                if (!evaluation) {
                    const profile = this.model.data.profiles[profileId];
                    evaluation = this.model.createEvaluation({
                        candidateId, profileId, vacancyId, status: 'En Progreso', globalScore: 0,
                        skills: JSON.parse(JSON.stringify(profile.skills)),
                        scores: profile.skills.map(s => ({ name: s.name, score: 5, notes: '' }))
                    });
                }
                this.view.renderEvaluationForm(evaluation, this.model.data.candidates[candidateId], this.model.data.profiles[profileId]);
            }

            updateScore(evalId, index, score) {
                this.model.updateEvaluationScore(evalId, index, score);
                const evaluation = this.model.data.evaluations[evalId];
                this.view.updateScoreUI(index, score, evaluation.globalScore);
            }

            scheduleInterview(id) {
                const date = document.getElementById('schedule-date').value;
                const time = document.getElementById('schedule-time').value;
                if (date && time) {
                    document.getElementById('scheduled-info').classList.remove('d-none');
                    this.view.showToast(`Entrevista agendada para el ${date} a las ${time}`, 'success');
                }
            }

            // Kanban Handlers
            handleDragStart(e, candidateId) {
                e.dataTransfer.setData('candidateId', candidateId);
            }

            handleDrop(e, stage) {
                const candidateId = e.dataTransfer.getData('candidateId');
                this.model.updateCandidateStatus(candidateId, stage);
                this.view.renderPipeline(this.model.data.candidates);
                this.view.showToast(`Candidato movido a ${stage}`, 'success');
            }

            aiAnalysis(id) {
                this.view.showToast("Analizando currículum con IA...", "info");
                setTimeout(() => {
                    this.view.showToast("Habilidades extraídas: JavaScript, Cloud, Agile. Match con vacante: 88%", "success");
                }, 1500);
            }

            addFeedback(id) {
                const reviewer = document.getElementById('feedback-reviewer').value;
                const comment = document.getElementById('feedback-comment').value;
                const rating = parseInt(document.getElementById('feedback-rating').value);

                if (reviewer && comment) {
                    this.model.addEvaluationFeedback(id, reviewer, comment, rating);
                    const evaluation = this.model.data.evaluations[id];
                    this.view.renderEvaluationForm(evaluation, this.model.data.candidates[evaluation.candidateId], this.model.data.profiles[evaluation.profileId]);
                    this.view.showToast("Feedback agregado", "success");
                }
            }

            finishEvaluation(id) {
                this.model.finishEvaluation(id);
                this.view.showToast("Evaluación guardada", "success");
                this.view.renderEvaluation(this.model.data);
            }

            updateThresholds() {
                this.model.updateThresholds(
                    parseInt(document.getElementById('threshold-recommended').value),
                    parseInt(document.getElementById('threshold-reserved').value)
                );
                this.view.showToast("Umbrales actualizados", "success");
            }

            exportData() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.model.data));
                const anchor = document.createElement('a');
                anchor.setAttribute("href", dataStr);
                anchor.setAttribute("download", `talentscout_backup_${new Date().toISOString().slice(0, 10)}.json`);
                anchor.click();
            }

            importData(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (imported.profiles && imported.candidates) {
                            this.model.data = imported;
                            this.model.saveData();
                            location.reload();
                        }
                    } catch (err) { this.view.showToast("Error al importar", "danger"); }
                };
                reader.readAsText(file);
            }

            loadDemoData() {
                if (confirm("Cargar datos de prueba?")) {
                    this.model.initDefaultData();
                    location.reload();
                }
            }

            renderAnalyticsTable() {
                const filter = document.getElementById('analytics-profile-filter').value;
                let evals = Object.entries(this.model.data.evaluations).filter(([id, e]) => e.status === 'Evaluado' && this.model.data.candidates[e.candidateId] && this.model.data.profiles[e.profileId]);
                if (filter !== 'all') evals = evals.filter(([id, e]) => e.profileId === filter);
                evals.sort(([ia, a], [ib, b]) => b.globalScore - a.globalScore);
                this.view.renderAnalyticsTable(evals, this.model.data.candidates, this.model.data.profiles, this.model.data.settings);
            }

            updateRadarChart() {
                const checked = Array.from(document.querySelectorAll('input[name="compare-candidate"]:checked')).map(cb => cb.value);
                if (checked.length < 2 || checked.length > 3) {
                    if (this.view.radarChart) { this.view.radarChart.destroy(); this.view.radarChart = null; }
                    return;
                }
                const evaluations = checked.map(id => this.model.data.evaluations[id]);
                const profile = this.model.data.profiles[evaluations[0].profileId];
                const labels = profile.skills.map(s => s.name);
                const datasets = evaluations.map((e, i) => {
                    const colors = ['rgba(54, 162, 235, 0.2)', 'rgba(255, 99, 132, 0.2)', 'rgba(75, 192, 192, 0.2)'];
                    const borders = ['rgb(54, 162, 235)', 'rgb(255, 99, 132)', 'rgb(75, 192, 192)'];
                    return { label: this.model.data.candidates[e.candidateId].name, data: e.scores.map(s => s.score), fill: true, backgroundColor: colors[i], borderColor: borders[i], pointBackgroundColor: borders[i] };
                });
                this.view.renderRadarChart(labels, datasets);
            }
        }

        /**
         * INITIALIZATION
         */
        document.addEventListener('DOMContentLoaded', () => {
            const model = new TalentScoutModel();
            const view = new TalentScoutView();
            const controller = new TalentScoutController(model, view);
            window.appController = controller; // Expose for inline handlers

            // Initial render
            controller.applyDarkMode(model.data.settings.darkMode);
            view.renderDashboard(model.data);
        });
    </script>
</body>
</html>
