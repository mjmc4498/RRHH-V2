<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentScout Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --sidebar-width: 280px;
            --sidebar-bg: #212529;
            --sidebar-color: #ffffff;
            --main-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --transition-speed: 0.3s;
        }

        body.dark-mode {
            --main-bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --sidebar-bg: #000000;
        }

        body.dark-mode #main-content {
            background-color: var(--main-bg);
        }

        body.dark-mode .list-group-item {
            color: var(--text-color);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .form-control,
        body.dark-mode .form-select {
            background-color: #2b2b2b;
            border-color: #404040;
            color: #ffffff;
        }

        body.dark-mode .form-control:focus,
        body.dark-mode .form-select:focus {
            background-color: #333333;
            color: #ffffff;
        }

        body.dark-mode .modal-content {
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        body.dark-mode .btn-close {
            filter: invert(1);
        }

        body {
            background-color: var(--main-bg) !important;
            color: var(--text-color) !important;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            min-height: 100vh;
            display: flex;
        }

        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            color: var(--sidebar-color);
            min-height: 100vh;
            position: fixed;
            transition: all var(--transition-speed);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        #main-content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 2rem;
            transition: margin-left var(--transition-speed);
        }

        .nav-pills .nav-link {
            color: rgba(255, 255, 255, 0.7);
            border-radius: 0;
            padding: 1rem 1.5rem;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }

        .nav-pills .nav-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .nav-pills .nav-link.active {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.15);
            border-left-color: #0d6efd;
        }

        .card {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            margin-bottom: 1.5rem;
        }

        .dark-mode-toggle {
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .dark-mode-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .badge-status {
            font-size: 0.8rem;
            padding: 0.4rem 0.6rem;
        }

        .candidate-photo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #dee2e6;
        }
    </style>
</head>
<body>
    <aside id="sidebar">
        <div class="p-4 d-flex flex-column h-100">
            <div class="d-flex align-items-center mb-5">
                <i class="bi bi-rocket-takeoff-fill fs-3 me-2 text-primary"></i>
                <h4 class="mb-0 fw-bold">TalentScout</h4>
            </div>

            <ul class="nav nav-pills flex-column mb-auto" id="mainTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" type="button" role="tab">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="profiles-tab" data-bs-toggle="tab" data-bs-target="#profiles" type="button" role="tab">
                        <i class="bi bi-folder2-open me-2"></i> Perfiles
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="candidates-tab" data-bs-toggle="tab" data-bs-target="#candidates" type="button" role="tab">
                        <i class="bi bi-people me-2"></i> Candidatos
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="evaluation-tab" data-bs-toggle="tab" data-bs-target="#evaluation" type="button" role="tab">
                        <i class="bi bi-clipboard-check me-2"></i> Evaluación
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="analytics-tab" data-bs-toggle="tab" data-bs-target="#analytics" type="button" role="tab">
                        <i class="bi bi-bar-chart me-2"></i> Analytics
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link w-100 text-start" id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings" type="button" role="tab">
                        <i class="bi bi-gear me-2"></i> Configuración
                    </button>
                </li>
            </ul>

            <div class="mt-auto pt-3 border-top border-secondary">
                <div class="d-flex align-items-center justify-content-between">
                    <span class="small text-secondary">v2.0 Enterprise</span>
                </div>
            </div>
        </div>
    </aside>

    <main id="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <h2 id="page-title" class="fw-bold">Dashboard</h2>
            <div id="header-actions" class="d-flex align-items-center">
                <i class="bi bi-moon-stars-fill fs-4 dark-mode-toggle me-3 text-secondary" id="darkModeToggle"></i>
                <!-- Contextual actions will appear here -->
            </div>
        </header>

        <div class="tab-content" id="mainTabsContent">
            <!-- Módulo 0: Dashboard -->
            <div class="tab-pane fade show active" id="dashboard" role="tabpanel">
                <!-- Dashboard content -->
            </div>

            <!-- Módulo 1: Gestión de Perfiles -->
            <div class="tab-pane fade" id="profiles" role="tabpanel">
                <!-- Profile content -->
            </div>

            <!-- Módulo 2: Base de Candidatos -->
            <div class="tab-pane fade" id="candidates" role="tabpanel">
                <!-- Candidates content -->
            </div>

            <!-- Módulo 3: Sala de Evaluación -->
            <div class="tab-pane fade" id="evaluation" role="tabpanel">
                <!-- Evaluation content -->
            </div>

            <!-- Módulo 4: Analytics & Comparación -->
            <div class="tab-pane fade" id="analytics" role="tabpanel">
                <!-- Analytics content -->
            </div>

            <!-- Módulo 5: Configuración Global -->
            <div class="tab-pane fade" id="settings" role="tabpanel">
                <!-- Settings content -->
            </div>
        </div>
    </main>

    <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="formModalLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="formModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="formModalSave">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalLabel">Confirmación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmModalDelete">Eliminar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Main App Logic will go here
        class TalentScoutApp {
            constructor() {
                this.data = {
                    profiles: {},
                    candidates: {},
                    settings: {
                        darkMode: false,
                        thresholds: {
                            recommended: 80,
                            reserved: 60
                        }
                    },
                    evaluations: {}
                };
                this.loadData();
                this.applyDarkMode();
            }

            loadData() {
                const data = localStorage.getItem('talentScoutData');
                if (data) {
                    const parsed = JSON.parse(data);
                    // Migration for dark mode setting
                    if (parsed.settings && parsed.settings.darkMode === undefined) {
                        parsed.settings.darkMode = false;
                    }
                    this.data = parsed;
                } else {
                    this.initDefaultData();
                }
            }

            saveData() {
                localStorage.setItem('talentScoutData', JSON.stringify(this.data));
            }

            initDefaultData() {
                this.data.profiles = {
                    '1': { id: '1', name: 'Desarrollador Full Stack', skills: [
                        { name: 'React', category: 'Hard Skill', weight: 5 },
                        { name: 'Node.js', category: 'Hard Skill', weight: 5 },
                        { name: 'Inglés', category: 'Soft Skill', weight: 3 },
                        { name: 'Comunicación', category: 'Soft Skill', weight: 4 }
                    ]},
                    '2': { id: '2', name: 'Product Manager', skills: [
                        { name: 'Agile', category: 'Hard Skill', weight: 5 },
                        { name: 'Roadmapping', category: 'Hard Skill', weight: 4 },
                        { name: 'Liderazgo', category: 'Soft Skill', weight: 5 },
                        { name: 'Empatía', category: 'Soft Skill', weight: 4 }
                    ]}
                };
                this.data.candidates = {
                    '1': { id: '1', name: 'Juan Perez', seniority: 'Senior', email: 'juan.perez@example.com', portfolio: 'https://example.com', status: 'Entrevistando', photoUrl: 'https://i.pravatar.cc/150?u=1' },
                    '2': { id: '2', name: 'Maria Garcia', seniority: 'Semi-Senior', email: 'maria.garcia@example.com', portfolio: 'https://example.com', status: 'Contratado', photoUrl: 'https://i.pravatar.cc/150?u=2' },
                    '3': { id: '3', name: 'Carlos Ruiz', seniority: 'Junior', email: 'carlos.ruiz@example.com', portfolio: 'https://example.com', status: 'Prospecto', photoUrl: 'https://i.pravatar.cc/150?u=3' }
                };
                this.data.evaluations = {
                    '1': {
                        id: '1',
                        candidateId: '1',
                        profileId: '1',
                        status: 'Evaluado',
                        skills: [
                            { name: 'React', category: 'Hard Skill', weight: 5 },
                            { name: 'Node.js', category: 'Hard Skill', weight: 5 },
                            { name: 'Inglés', category: 'Soft Skill', weight: 3 },
                            { name: 'Comunicación', category: 'Soft Skill', weight: 4 }
                        ],
                        scores: [
                            { name: 'React', score: 9, notes: 'Excelente dominio' },
                            { name: 'Node.js', score: 8, notes: 'Muy bueno' },
                            { name: 'Inglés', score: 7, notes: 'Bueno' },
                            { name: 'Comunicación', score: 8, notes: 'Claro y conciso' }
                        ],
                        globalScore: 8.12,
                        finalRecommendation: 'Excelente candidato técnico con buenas habilidades de comunicación.'
                    },
                    '2': {
                        id: '2',
                        candidateId: '2',
                        profileId: '1',
                        status: 'Evaluado',
                        skills: [
                            { name: 'React', category: 'Hard Skill', weight: 5 },
                            { name: 'Node.js', category: 'Hard Skill', weight: 5 },
                            { name: 'Inglés', category: 'Soft Skill', weight: 3 },
                            { name: 'Comunicación', category: 'Soft Skill', weight: 4 }
                        ],
                        scores: [
                            { name: 'React', score: 7, notes: 'Bueno' },
                            { name: 'Node.js', score: 6, notes: 'Aceptable' },
                            { name: 'Inglés', score: 8, notes: 'Fluido' },
                            { name: 'Comunicación', score: 9, notes: 'Excelente comunicadora' }
                        ],
                        globalScore: 7.29,
                        finalRecommendation: 'Buen perfil, aunque le falta profundidad técnica en Node.js.'
                    }
                };
                this.saveData();
            }
        }

        // Extend TalentScoutApp with all module methods
        Object.assign(TalentScoutApp.prototype, {
            bindEvents() {
                document.getElementById('darkModeToggle').addEventListener('click', () => {
                    this.data.settings.darkMode = !this.data.settings.darkMode;
                    this.saveData();
                    this.applyDarkMode();
                });

                document.getElementById('mainTabs').addEventListener('shown.bs.tab', (e) => {
                    const target = e.target.textContent.trim();
                    document.getElementById('page-title').textContent = target;

                    if (e.target.id === 'dashboard-tab') this.renderDashboard();
                    if (e.target.id === 'profiles-tab') this.renderProfiles();
                    if (e.target.id === 'candidates-tab') this.renderCandidates();
                    if (e.target.id === 'evaluation-tab') this.renderEvaluation();
                    if (e.target.id === 'analytics-tab') this.renderAnalytics();
                    if (e.target.id === 'settings-tab') this.renderSettings();
                });

                document.getElementById('mainTabsContent').addEventListener('click', (e) => {
                    if (e.target.matches('[data-action="edit-profile"]')) {
                        this.editProfile(e.target.dataset.id);
                    }
                    if (e.target.matches('[data-action="delete-profile"]')) {
                        this.deleteProfile(e.target.dataset.id);
                    }
                    if (e.target.matches('[data-action="create-profile"]')) {
                        this.createProfile();
                    }
                    if (e.target.matches('[data-action="add-skill"]')) {
                        this.addSkill(e.target.dataset.id);
                    }
                    if (e.target.matches('[data-action="delete-skill"]')) {
                        this.deleteSkill(e.target.dataset.id, e.target.dataset.index);
                    }
                    if (e.target.matches('[data-action="delete-candidate"]')) {
                        this.deleteCandidate(e.target.dataset.id);
                    }
                    if (e.target.matches('[data-action="start-evaluation"]')) {
                        this.startEvaluation();
                    }
                    if (e.target.matches('[data-action="finish-evaluation"]')) {
                        this.finishEvaluation(e.target.dataset.id);
                    }
                    if (e.target.matches('[data-action="reset-data"]')) {
                        this.resetData();
                    }
                    if (e.target.matches('[data-action="export-data"]')) {
                        this.exportData();
                    }
                    if (e.target.matches('[data-action="import-data-trigger"]')) {
                        document.getElementById('import-data-file').click();
                    }
                    if (e.target.matches('[data-action="load-demo"]')) {
                        this.loadDemoData();
                    }
                });

                document.getElementById('mainTabsContent').addEventListener('input', (e) => {
                    if (e.target.matches('[data-action="update-score"]')) {
                        this.updateScore(e.target.dataset.id, e.target.dataset.index, e.target.value);
                    }
                });

                document.getElementById('mainTabsContent').addEventListener('change', (e) => {
                    if (e.target.id === 'import-data-file') {
                        this.importData(e.target.files[0]);
                    }

                    if (e.target.matches('[data-action="update-profile-name"]')) {
                        this.updateProfileName(e.target.dataset.id, e.target.value);
                    } else if (e.target.matches('[data-action="update-score"]')) {
                        this.updateScore(e.target.dataset.id, e.target.dataset.index, e.target.value);
                    } else if (e.target.matches('[data-action="update-notes"]')) {
                        this.updateNotes(e.target.dataset.id, e.target.dataset.index, e.target.value);
                    } else if (e.target.matches('[data-action="update-final-rec"]')) {
                        const evalId = e.target.dataset.id;
                        this.data.evaluations[evalId].finalRecommendation = e.target.value;
                        this.saveData();
                    } else if (e.target.matches('#candidate-search')) {
                        const searchTerm = e.target.value.toLowerCase();
                        const filteredCandidates = Object.values(this.data.candidates).filter(c => c.name.toLowerCase().includes(searchTerm));
                        document.getElementById('candidate-list').innerHTML = this.renderCandidateList(filteredCandidates);
                    } else if (e.target.matches('#analytics-profile-filter')) {
                        this.renderAnalyticsTable();
                    } else if (e.target.matches('input[name="compare-candidate"]')) {
                        this.updateRadarChart();
                    } else if (e.target.matches('[data-action="update-thresholds"]')) {
                        this.updateThresholds();
                    }
                });

                document.getElementById('mainTabsContent').addEventListener('submit', (e) => {
                    if (e.target.matches('#candidate-form')) {
                        e.preventDefault();
                        this.addCandidate();
                    }
                });

            },

            applyDarkMode() {
                if (this.data.settings.darkMode) {
                    document.body.classList.add('dark-mode');
                    document.documentElement.setAttribute('data-bs-theme', 'dark');
                    document.getElementById('darkModeToggle').classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
                } else {
                    document.body.classList.remove('dark-mode');
                    document.documentElement.setAttribute('data-bs-theme', 'light');
                    document.getElementById('darkModeToggle').classList.replace('bi-sun-fill', 'bi-moon-stars-fill');
                }
            },

            renderDashboard() {
                const container = document.getElementById('dashboard');
                const stats = {
                    totalCandidates: Object.keys(this.data.candidates).length,
                    activeProfiles: Object.keys(this.data.profiles).length,
                    evaluations: Object.values(this.data.evaluations).filter(e => e.status === 'Evaluado').length,
                    avgScore: 0
                };

                const evals = Object.values(this.data.evaluations).filter(e => e.status === 'Evaluado');
                if (evals.length > 0) {
                    stats.avgScore = evals.reduce((acc, curr) => acc + curr.globalScore, 0) / evals.length;
                }

                container.innerHTML = `
                    <div class="row g-4 mb-4">
                        <div class="col-md-3">
                            <div class="card p-3 text-center">
                                <h6 class="text-secondary mb-2">Candidatos Totales</h6>
                                <h2 class="fw-bold mb-0">${stats.totalCandidates}</h2>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 text-center">
                                <h6 class="text-secondary mb-2">Perfiles Activos</h6>
                                <h2 class="fw-bold mb-0">${stats.activeProfiles}</h2>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 text-center">
                                <h6 class="text-secondary mb-2">Entrevistas Realizadas</h6>
                                <h2 class="fw-bold mb-0">${stats.evaluations}</h2>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 text-center">
                                <h6 class="text-secondary mb-2">Puntuación Media</h6>
                                <h2 class="fw-bold mb-0">${stats.avgScore.toFixed(2)}</h2>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-7">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title mb-4">Candidatos Recientes</h5>
                                    <ul class="list-group list-group-flush">
                                        ${Object.values(this.data.candidates).slice(-5).reverse().map(c => `
                                            <li class="list-group-item bg-transparent d-flex justify-content-between align-items-center px-0">
                                                <div class="d-flex align-items-center">
                                                    <img src="${c.photoUrl || 'https://i.pravatar.cc/150?u='+c.id}" class="candidate-photo me-3" alt="">
                                                    <div>
                                                        <p class="mb-0 fw-bold">${c.name}</p>
                                                        <small class="text-secondary">${c.email}</small>
                                                    </div>
                                                </div>
                                                <span class="badge bg-primary-subtle text-primary">${c.status || 'Prospecto'}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title mb-4">Estado de Candidatos</h5>
                                    <canvas id="statusChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                this.renderStatusChart();
            },

            renderStatusChart() {
                const ctx = document.getElementById('statusChart').getContext('2d');
                const statuses = {};
                Object.values(this.data.candidates).forEach(c => {
                    const s = c.status || 'Prospecto';
                    statuses[s] = (statuses[s] || 0) + 1;
                });

                if (this.statusChart) this.statusChart.destroy();

                this.statusChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(statuses),
                        datasets: [{
                            data: Object.values(statuses),
                            backgroundColor: [
                                '#0d6efd',
                                '#198754',
                                '#ffc107',
                                '#dc3545',
                                '#6c757d'
                            ]
                        }]
                    },
                    options: {
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            },

            renderProfiles() {
                const container = document.getElementById('profiles');
                const profiles = Object.values(this.data.profiles);

                let content = `
                    <div class="row mt-3">
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-body">
                                    <h2 class="card-title">Perfiles</h2>
                                    <ul class="list-group">
                                        ${profiles.map(p => `
                                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                                ${p.name}
                                                <div>
                                                    <button class="btn btn-sm btn-primary" data-action="edit-profile" data-id="${p.id}">✏️</button>
                                                    <button class="btn btn-sm btn-danger" data-action="delete-profile" data-id="${p.id}">🗑️</button>
                                                </div>
                                            </li>
                                        `).join('')}
                                    </ul>
                                    <button class="btn btn-primary mt-3" data-action="create-profile">Nuevo Perfil</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-8" id="profile-details">
                            <!-- Profile details will be rendered here -->
                        </div>
                    </div>
                `;
                container.innerHTML = content;
            },

            createProfile() {
                const formModal = new bootstrap.Modal(document.getElementById('formModal'));
                document.getElementById('formModalLabel').innerText = 'Nuevo Perfil';
                document.getElementById('formModalBody').innerHTML = `
                    <div class="mb-3">
                        <label for="new-profile-name" class="form-label">Nombre del Perfil</label>
                        <input type="text" id="new-profile-name" class="form-control">
                    </div>
                `;
                document.getElementById('formModalSave').onclick = () => {
                    const name = document.getElementById('new-profile-name').value;
                    if (name) {
                        const id = Date.now().toString();
                        this.data.profiles[id] = { id, name, skills: [] };
                        this.saveData();

                const isUsed = Object.values(this.data.evaluations).some(e => e.profileId === id);
                const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
                const confirmModalBody = document.getElementById('confirmModalBody');

                let message = '¿Está seguro que desea eliminar este perfil?';
                if (isUsed) {
                    message = 'Este perfil está siendo utilizado en evaluaciones. ¿Está seguro que desea eliminarlo?'
                }

                confirmModalBody.innerText = message;

                document.getElementById('confirmModalDelete').onclick = () => {
                    delete this.data.profiles[id];

                    document.getElementById('profile-details').innerHTML = '';

                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "talentscout_backup_" + new Date().toISOString().slice(0, 10) + ".json");

                        if (importedData.profiles && importedData.candidates) {
                            this.data = importedData;
                            this.saveData();
                            alert("Datos importados con éxito.");

                        candidateId,
                        profileId,
                        status: 'En Progreso',

                        skills: JSON.parse(JSON.stringify(profile.skills)), // Deep copy of skills
                        scores: profile.skills.map(skill => ({ name: skill.name, score: 5, notes: '' })),

            updateScore(evalId, skillIndex, score) {
                const evaluation = this.data.evaluations[evalId];
                evaluation.scores[skillIndex].score = parseInt(score);
                const scoreVal = document.getElementById(`score-val-${skillIndex}`);
                if (scoreVal) scoreVal.textContent = score;
                this.calculateGlobalScore(evaluation);
                document.getElementById('global-score').textContent = evaluation.globalScore.toFixed(2);
                this.saveData();

            updateNotes(evalId, skillIndex, notes) {
                this.data.evaluations[evalId].scores[skillIndex].notes = notes;
                this.saveData();
            },

            calculateGlobalScore(evaluation) {
                let totalScore = 0;
                let totalWeight = 0;
                evaluation.skills.forEach((skill, index) => {
                    totalScore += evaluation.scores[index].score * skill.weight;
                    totalWeight += skill.weight;
                });
                evaluation.globalScore = totalWeight > 0 ? totalScore / totalWeight : 0;
            },

            finishEvaluation(evalId) {

            renderAnalytics() {

                const profiles = Object.values(this.data.profiles);
                let content = `

                        <div class="card-body">
                            <h2 class="card-title">Ranking de Candidatos</h2>

                                    <option value="all">Todos los Perfiles</option>
                                    ${profiles.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}

                    <div class="card mt-3">

            renderAnalyticsTable() {
                const container = document.getElementById('analytics-table-container');
                const profileFilter = document.getElementById('analytics-profile-filter') ? document.getElementById('analytics-profile-filter').value : 'all';

                let evaluations = Object.entries(this.data.evaluations).filter(([id, e]) => e.status === 'Evaluado');

                // Filter out evaluations where candidate or profile no longer exists
                evaluations = evaluations.filter(([id, e]) => this.data.candidates[e.candidateId] && this.data.profiles[e.profileId]);

                if (profileFilter !== 'all') {
                    evaluations = evaluations.filter(([id, e]) => e.profileId === profileFilter);
                }

                evaluations.sort(([idA, a], [idB, b]) => b.globalScore - a.globalScore);

                let content = `
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Candidato</th>
                                <th>Perfil</th>
                                <th>Score Global</th>
                                <th>Feedback Final</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${evaluations.map(([id, e]) => {
                                const candidate = this.data.candidates[e.candidateId];
                                const profile = this.data.profiles[e.profileId];
                                const scorePercentage = e.globalScore * 10;
                                let feedback = '';
                                let feedbackClass = '';

                                if (scorePercentage >= this.data.settings.thresholds.recommended) {
                                    feedback = 'Contratación Altamente Recomendada';
                                    feedbackClass = 'bg-success text-white';
                                } else if (scorePercentage >= this.data.settings.thresholds.reserved) {
                                    feedback = 'Considerar con Reservas';
                                    feedbackClass = 'bg-warning text-dark';
                                } else {
                                    feedback = 'No cumple el perfil';
                                    feedbackClass = 'bg-danger text-white';
                                }

                                return `
                                    <tr>
                                        <td><input type="checkbox" class="form-check-input" name="compare-candidate" value="${id}"></td>
                                        <td>${candidate.name}</td>
                                        <td>${profile.name}</td>
                                        <td><strong>${e.globalScore.toFixed(2)}</strong></td>
                                        <td><span class="badge ${feedbackClass}">${feedback}</span></td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
                container.innerHTML = content;
                this.updateRadarChart();
            },

            updateRadarChart() {
                const allCheckBoxes = document.querySelectorAll('input[name="compare-candidate"]');
                const checkedBoxes = document.querySelectorAll('input[name="compare-candidate"]:checked');
                const evalIds = Array.from(checkedBoxes).map(cb => cb.value);

                if (evalIds.length === 0) {
                    allCheckBoxes.forEach(cb => cb.disabled = false);
                    if (this.radarChart) {
                        this.radarChart.destroy();
                        this.radarChart = null;
                    }
                    return;
                }

                const firstEvaluation = this.data.evaluations[evalIds[0]];
                const profileId = firstEvaluation.profileId;

                allCheckBoxes.forEach(cb => {
                    if (!evalIds.includes(cb.value)) {
                        const evalutation = this.data.evaluations[cb.value];
                        if (evalutation.profileId !== profileId) {
                            cb.disabled = true;
                        }
                    }
                });

                if (evalIds.length < 2 || evalIds.length > 3) {
                    if (this.radarChart) {
                        this.radarChart.destroy();
                        this.radarChart = null;
                    }
                    return;
                }

                const evaluations = evalIds.map(id => this.data.evaluations[id]);
                const profile = this.data.profiles[profileId];
                const labels = profile.skills.map(s => s.name);

                const datasets = evaluations.map((e, index) => {
                    const candidate = this.data.candidates[e.candidateId];
                    const colors = [
                        'rgba(54, 162, 235, 0.2)',
                        'rgba(255, 99, 132, 0.2)',
                        'rgba(75, 192, 192, 0.2)'
                    ];
                    const borderColors = [
                        'rgb(54, 162, 235)',
                        'rgb(255, 99, 132)',
                        'rgb(75, 192, 192)'
                    ];
                    return {
                        label: candidate.name,
                        data: e.scores.map(s => s.score),
                        fill: true,
                        backgroundColor: colors[index],
                        borderColor: borderColors[index],
                        pointBackgroundColor: borderColors[index],
                    };
                });

                const ctx = document.getElementById('radarChart').getContext('2d');
                if (this.radarChart) {
                    this.radarChart.destroy();
                }
                this.radarChart = new Chart(ctx, {
                    type: 'radar',
                    data: { labels, datasets },
                    options: {
                        elements: {
                            line: {
                                borderWidth: 3
                            }
                        },
                        scales: {
                            r: {
                                angleLines: {
                                    display: false
                                },
                                suggestedMin: 0,
                                suggestedMax: 10
                            }
                        }
                    }
                });
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            window.app = new TalentScoutApp();
            app.bindEvents();
            if (typeof app.renderDashboard === 'function') {
                app.renderDashboard();
            } else {
                app.renderProfiles();
            }
        });
    </script>
</body>
</html>
