<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentScout Enterprise - Advanced ATS</title>
    <!-- External Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Application Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <aside id="sidebar">
        <div class="p-4 d-flex flex-column h-100">
            <div class="d-flex align-items-center mb-5 ps-3">
                <i class="bi bi-rocket-takeoff-fill fs-2 me-2 text-primary"></i>
                <h4 class="mb-0 fw-bold">TalentScout</h4>
            </div>

            <ul class="nav nav-pills flex-column mb-auto" id="mainTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" type="button" role="tab">
                        <i class="bi bi-grid-1x2"></i> <span>Dashboard</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pipeline-tab" data-bs-toggle="tab" data-bs-target="#pipeline" type="button" role="tab">
                        <i class="bi bi-kanban"></i> <span>Pipeline</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="profiles-tab" data-bs-toggle="tab" data-bs-target="#profiles" type="button" role="tab">
                        <i class="bi bi-person-badge"></i> <span>Perfiles</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="vacancies-tab" data-bs-toggle="tab" data-bs-target="#vacancies" type="button" role="tab">
                        <i class="bi bi-briefcase"></i> <span>Vacantes</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="candidates-tab" data-bs-toggle="tab" data-bs-target="#candidates" type="button" role="tab">
                        <i class="bi bi-people"></i> <span>Candidatos</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="evaluation-tab" data-bs-toggle="tab" data-bs-target="#evaluation" type="button" role="tab">
                        <i class="bi bi-clipboard-check"></i> <span>Evaluación</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="analytics-tab" data-bs-toggle="tab" data-bs-target="#analytics" type="button" role="tab">
                        <i class="bi bi-bar-chart-steps"></i> <span>Analytics</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings" type="button" role="tab">
                        <i class="bi bi-sliders2"></i> <span>Configuración</span>
                    </button>
                </li>
            </ul>

            <div class="mt-auto pt-3 border-top border-secondary-subtle mx-3">
                <div class="mb-4">
                    <label class="small text-secondary fw-bold mb-2">MODO ACCESO</label>
                    <select class="form-select form-select-sm border-0 bg-light" data-action="switch-role">
                        <option value="Admin">Administrador</option>
                        <option value="Recruiter">Reclutador</option>
                        <option value="Interviewer">Entrevistador</option>
                    </select>
                </div>
                <div class="d-grid gap-2 mb-4">
                    <button class="btn btn-primary btn-sm rounded-pill py-2" data-action="toggle-portal">
                        <i class="bi bi-box-arrow-up-right me-2"></i> Portal Candidato
                    </button>
                </div>
                <div class="d-flex align-items-center justify-content-between pb-3">
                    <span class="small text-secondary">v4.0 Enterprise</span>
                    <i class="bi bi-moon-stars-fill dark-mode-toggle" id="darkModeToggle"></i>
                </div>
            </div>
        </div>
    </aside>

    <main id="main-content">
        <div id="candidate-portal" class="d-none">
            <!-- Portal dynamic content -->
        </div>

        <div id="recruiter-app">
            <header class="d-flex justify-content-between align-items-center mb-5">
                <h1 id="page-title" class="h2 fw-bold text-dark mb-0">Dashboard</h1>
                <div id="header-actions" class="d-flex align-items-center">
                    <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill">Suscripción Enterprise</span>
                </div>
            </header>

            <div class="tab-content" id="mainTabsContent">
                <div class="tab-pane fade show active" id="dashboard" role="tabpanel"></div>
                <div class="tab-pane fade" id="pipeline" role="tabpanel"></div>
                <div class="tab-pane fade" id="profiles" role="tabpanel"></div>
                <div class="tab-pane fade" id="vacancies" role="tabpanel"></div>
                <div class="tab-pane fade" id="candidates" role="tabpanel"></div>
                <div class="tab-pane fade" id="evaluation" role="tabpanel"></div>
                <div class="tab-pane fade" id="analytics" role="tabpanel"></div>
                <div class="tab-pane fade" id="settings" role="tabpanel"></div>
            </div>
        </div>
    </main>

    <!-- Global Modals -->
    <div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="formModalLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4" id="formModalBody"></div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" id="formModalSave">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold text-danger">Confirmar Acción</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmModalBody"></div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger rounded-pill px-4" id="confirmModalDelete">Eliminar Permanentemente</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-4">
        <div id="liveToast" class="toast border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header border-0 bg-transparent">
                <i class="bi me-2 fs-5"></i>
                <strong class="me-auto">TalentScout Cloud</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body pt-0 pb-3" id="toastMessage"></div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Application Modules -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
